<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="color-scheme" content="dark" />
<title>dev: ui + real modules</title>
<style>html, body { margin: 0; height: 100%; background: #04060c; color: #9fb0c8; font: 14px/1.4 system-ui, sans-serif; } p { padding: 1.5rem; } a { color: #6ee7f0; }</style>
</head>
<body>
<p>This page moved: the interface wired to the real modules is <a id="go" href="shell.html?mock=0">dev/shell.html?mock=0</a>.</p>
<script>
// The integration preview that lived here composed the modules by hand, the way main.js does. The
// shell dev page now runs main.js itself (with mock=0: no stand-ins), so there is one composition
// to keep right. The query is passed on.
const q = new URLSearchParams( location.search );
if ( ! q.has( 'mock' ) ) q.set( 'mock', '0' );
const url = 'shell.html?' + q.toString() + location.hash;
document.getElementById( 'go' ).href = url;
location.replace( url );
</script>
</body>
</html>
